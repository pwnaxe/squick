# Weekly dependency updates. Cargo covers the Rust workspace; the npm
# entries track the VS Code extension and the napi-rs binding; github-actions
# keeps the CI/release workflows current.
#
# Groups are capped to minor/patch: every breakage we've hit came from a
# major bump, and grouping majors in means one broken package blocks every
# safe bump behind it. Majors fall out of the group and open their own PR
# instead, reviewed and merged individually.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/extensions/vscode"
    schedule:
      interval: weekly
    groups:
      vscode-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: weekly
    groups:
      node-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
